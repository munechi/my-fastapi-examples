[project]
name = "crud"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taizo Munemura", email = "github@velvet.sakura.ne.jp" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlalchemy>=2.1.7",
]

[project.scripts]
crud = "crud:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
